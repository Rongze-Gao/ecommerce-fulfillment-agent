# 本地基础设施：MySQL 存 raw/curated/serving，Redis Stack 存评论向量与对话记忆。
# 端口只绑定 127.0.0.1，密码来自项目根目录 .env。
name: ecommerce-fulfillment-agent

services:
  mysql:
    image: mysql:8.4.8
    container_name: ecommerce-fulfillment-mysql

    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT}:3306"

    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      TZ: "UTC"

    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_0900_ai_ci"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - backend

    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping -h 127.0.0.1 -u root --silent']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis/redis-stack-server:7.4.0-v8
    container_name: ecommerce-fulfillment-redis

    ports:
      - "127.0.0.1:${REDIS_HOST_PORT}:6379"

    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_ARGS: "--requirepass ${REDIS_PASSWORD} --appendonly yes --appendfsync everysec"
      TZ: "UTC"

    volumes:
      - redis_data:/data

    networks:
      - backend

    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  mysql_data:
    name: ecommerce-fulfillment-mysql-data

  redis_data:
    name: ecommerce-fulfillment-redis-data

networks:
  backend:
    name: ecommerce-fulfillment-network
    driver: bridge